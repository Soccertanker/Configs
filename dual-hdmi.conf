context.modules = [
    { name = libpipewire-module-combine-stream
      args = {
          combine.mode = sink
          node.name = "DualHDMI"
          node.description = "Dual HDMI Output"
          combine.props = {
              audio.position = [ FL FR ]
          }
          stream.rules = [
              {
                  matches = [
                      {
                          # This matches your specific GPU outputs
                          device.name = "~alsa_card.pci-0000_01_00.1"
                      }
                  ]
                  actions = {
                      create-stream = {
                          # Use the specific output names we found
                          target.nodes = [ 
                            "alsa_output.pci-0000_01_00.1.pro-output-3" 
                            "alsa_output.pci-0000_01_00.1.pro-output-7" 
                          ]
                      }
                  }
              }
          ]
      }
    }
]
